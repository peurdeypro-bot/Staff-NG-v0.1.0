<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel STAFF NationsGlory 0.1.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contairer">
        <div class="form-box active" style="text-align:center;">
            <h2 id="bienvenue">Bienvenue</h2>
            <p class="role-arrive" id="role-txt" style="margin-bottom:20px;"></p>
            <p style="color:#9497a8; font-size:13.5px;">Le panneau complet (Modération, Administration, etc.) arrive bientôt ici.</p>
            <button id="logout-btn" style="margin-top:20px;">Se déconnecter</button>
        </div>
    </div>

<script>
let user = null;
try { user = JSON.parse(localStorage.getItem('ngo_logged_user') || 'null'); } catch(e) {}

if (!user) {
    window.location.href = 'index.html';
} else {
    document.getElementById('bienvenue').textContent = 'Bienvenue, ' + user.pseudo;

    const roleTxt = document.getElementById('role-txt');

    roleTxt.textContent = user.role || '';

    const texte = roleTxt.textContent.toLowerCase();

    if (texte.includes("admin")) {
        roleTxt.style.color= "#EF4444";
        roleTxt.style.fontWeight = "bold";
    }else if (texte.includes("SM")) {
        roleTxt.style.color = "#3b82f6";
        roleTxt.style.fontWeight = "bold";
    } else if (texte.includes("modo+")) {
        roleTxt.style.color = "#22c55e";
        roleTxt.style.fontWeight = "bold";
    } else if (texte.includes("modoc")) {
        roleTxt.style.color = "#22c55e";
        roleTxt.style.fontWeight = "bold";
    } else if (texte.includes("modot")) {
        roleTxt.style.color = "#22c55e";
        roleTxt.style.fontWeight = "bold";
    } else if (texte.includes("guide")) {
        roleTxt.style.color = "#a855f7";
        roleTxt.style.fontWeight = "bold";
    }
}

document.getElementById('logout-btn').addEventListener('click', () => {
    localStorage.removeItem('ngo_logged_user');
    window.location.href = 'index.html';
});



</script>
</body>
</html>
